name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run check` runs `wrangler types`, which learns binding names from
      # `.env`. That file is gitignored (it holds the real API key locally),
      # so on the runner it's missing and `Env` comes out without
      # GOOGLE_GENERATIVE_AI_API_KEY, failing the typecheck. .env.example has
      # the same key with an empty value, which is enough for wrangler to
      # generate the right type -- no real secret involved.
      - run: cp .env.example .env

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
